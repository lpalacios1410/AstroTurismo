<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#020305"/>
      <stop offset="1" stop-color="#0a1224"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#00F5FF" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="0.75" stop-color="#00F5FF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#00F5FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="ribbon" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="600" height="800" fill="url(#sky)"/>

  <g fill="#EAF2FF">
    <circle cx="80" cy="120" r="1.4" opacity="0.7"/>
    <circle cx="200" cy="70" r="1" opacity="0.5"/>
    <circle cx="340" cy="140" r="1.6" opacity="0.8"/>
    <circle cx="490" cy="60" r="1.1" opacity="0.55"/>
    <circle cx="560" cy="210" r="1.3" opacity="0.7"/>
    <circle cx="140" cy="280" r="1" opacity="0.45"/>
    <circle cx="420" cy="250" r="1.2" opacity="0.6"/>
    <circle cx="60" cy="380" r="1" opacity="0.5"/>
  </g>

  <path d="M-40 360 Q 180 200 400 310 T 680 260 L 680 540 L -40 540 Z" fill="url(#aurora)" filter="url(#soft)" opacity="0.75"/>
  <path d="M-40 400 C 160 240 340 360 520 280 C 600 244 640 300 680 290" fill="none" stroke="url(#aurora)" stroke-width="66" stroke-linecap="round" filter="url(#ribbon)" opacity="0.85"/>
  <path d="M-40 470 C 200 320 420 430 580 350 C 620 332 650 350 680 340" fill="none" stroke="url(#aurora)" stroke-width="30" stroke-linecap="round" filter="url(#ribbon)" opacity="0.7"/>

  <circle cx="420" cy="100" r="24" fill="#EAF2FF" opacity="0.1" filter="url(#soft)"/>
  <circle cx="420" cy="100" r="9" fill="#EAF2FF" opacity="0.9"/>
  <circle cx="420" cy="100" r="2.6" fill="#ffffff"/>

  <path d="M0 800 L0 660 L100 580 L220 640 L320 520 L420 620 L520 560 L600 640 L600 800 Z" fill="#05070A"/>
  <path d="M0 800 L0 730 L140 670 L260 710 L380 650 L500 700 L600 670 L600 800 Z" fill="#020305"/>
</svg>
