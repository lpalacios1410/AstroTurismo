<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#020305"/>
      <stop offset="1" stop-color="#100a24"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#BC13FE" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#BC13FE" stop-opacity="0.55"/>
      <stop offset="0.75" stop-color="#f0abfc" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#f0abfc" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="ribbon" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="600" height="800" fill="url(#sky)"/>

  <g fill="#EAF2FF">
    <circle cx="120" cy="60" r="1.4" opacity="0.7"/>
    <circle cx="230" cy="150" r="1" opacity="0.5"/>
    <circle cx="360" cy="90" r="1.6" opacity="0.8"/>
    <circle cx="520" cy="120" r="1.1" opacity="0.55"/>
    <circle cx="70" cy="230" r="1.3" opacity="0.7"/>
    <circle cx="310" cy="270" r="1" opacity="0.45"/>
    <circle cx="470" cy="220" r="1.2" opacity="0.6"/>
    <circle cx="570" cy="300" r="1" opacity="0.5"/>
    <circle cx="180" cy="360" r="1.4" opacity="0.65"/>
  </g>

  <path d="M-40 340 Q 160 210 380 290 T 680 240 L 680 520 L -40 520 Z" fill="url(#aurora)" filter="url(#soft)" opacity="0.85"/>
  <path d="M-40 390 C 140 230 300 340 460 270 C 560 226 620 300 680 280" fill="none" stroke="url(#aurora)" stroke-width="60" stroke-linecap="round" filter="url(#ribbon)" opacity="0.85"/>
  <path d="M-40 460 C 180 300 360 420 540 340 C 600 312 640 340 680 330" fill="none" stroke="url(#aurora)" stroke-width="30" stroke-linecap="round" filter="url(#ribbon)" opacity="0.7"/>

  <circle cx="180" cy="110" r="24" fill="#EAF2FF" opacity="0.1" filter="url(#soft)"/>
  <circle cx="180" cy="110" r="9" fill="#EAF2FF" opacity="0.9"/>
  <circle cx="180" cy="110" r="2.6" fill="#ffffff"/>

  <path d="M0 800 L0 640 L70 600 L120 640 L170 570 L230 640 L330 520 L430 610 L520 550 L600 620 L600 800 Z" fill="#05070A"/>
  <path d="M0 800 L0 710 L110 660 L210 700 L330 630 L450 690 L560 650 L600 680 L600 800 Z" fill="#020305"/>
</svg>
